services:
  nodegoat-mongo:
    image: mongo:4.4
    container_name: nodegoat-mongo
    ports:
      - "27017:27017"

  nodegoat:
    image: nodegoat-web:latest
    container_name: nodegoat
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://nodegoat-mongo:27017/nodegoat
    depends_on:
      - nodegoat-mongo
    working_dir: /home/node/app
    command: node server.js

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  bwapp:
    image: raesene/bwapp:latest
    container_name: bwapp
    ports:
      - "80:80"
    environment:
      - MYSQL_ROOT_PASSWORD=bug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/install.php"]
      interval: 10s
      timeout: 5s
      retries: 10
