services:
  nodegoat-mongo:
    image: mongo:4.4
    container_name: nodegoat-mongo
    ports:
      - "27017:27017"
    volumes:
      - nodegoat-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  nodegoat:
    image: nodegoat-web:latest
    container_name: nodegoat
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://nodegoat-mongo:27017/nodegoat
    depends_on:
      nodegoat-mongo:
        condition: service_healthy
    working_dir: /home/node/app
    command: node server.js
    restart: unless-stopped

  juiceshop:
    image: bkimminich/juice-shop:v15.3.0  # Pin to specific version (not :latest)
    container_name: juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp:latest  # Note: no versioned tags available for bWAPP
    container_name: bwapp
    ports:
      - "8080:80"
    environment:
      - MYSQL_ROOT_PASSWORD=bug
    restart: unless-stopped

volumes:
  nodegoat-mongo-data:
