name: DevSecOps Risk Intelligence Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: python -m pytest pipeline/tests/ -v --tb=short

      - name: Start Target Applications
        run: |
          docker compose -f targets/docker-compose.yml up -d
          echo "Waiting for targets..."
          for i in $(seq 1 30); do
            curl -s --max-time 5 http://localhost:3000 >/dev/null 2>&1 && \
            curl -s --max-time 5 http://localhost:4000 >/dev/null 2>&1 && \
            curl -s --max-time 5 http://localhost:8080 >/dev/null 2>&1 && break
            sleep 2
          done
          echo "Targets ready"

      - name: Run Scanners
        run: |
          mkdir -p scan_reports
          # Nuclei
          docker run --rm --network=host \
            -v $(pwd)/scan_reports:/out \
            projectdiscovery/nuclei:v3.3.0 \
            -u http://localhost:3000 -jsonl -o /out/juiceshop_nuclei.json || true
          docker run --rm --network=host \
            -v $(pwd)/scan_reports:/out \
            projectdiscovery/nuclei:v3.3.0 \
            -u http://localhost:4000 -jsonl -o /out/nodegoat_nuclei.json || true
          docker run --rm --network=host \
            -v $(pwd)/scan_reports:/out \
            projectdiscovery/nuclei:v3.3.0 \
            -u http://localhost:8080 -jsonl -o /out/bwapp_nuclei.json || true
          # ZAP (baseline mode, resource-limited)
          docker run --rm --network=host \
            --memory=1g --cpus=1 \
            -v $(pwd)/scan_reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:2.15.0 \
            zap-baseline.py -t http://localhost:3000 \
            -J /zap/wrk/juiceshop_zap.json || true
          docker run --rm --network=host \
            --memory=1g --cpus=1 \
            -v $(pwd)/scan_reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:2.15.0 \
            zap-baseline.py -t http://localhost:4000 \
            -J /zap/wrk/nodegoat_zap.json || true
          docker run --rm --network=host \
            --memory=1g --cpus=1 \
            -v $(pwd)/scan_reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:2.15.0 \
            zap-baseline.py -t http://localhost:8080 \
            -J /zap/wrk/bwapp_zap.json || true

      - name: Run 9-Stage Risk Pipeline
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p outputs
          python -m pipeline.run \
            --reports scan_reports/ \
            --config config.json \
            --out outputs/

      - name: Upload Pipeline Outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs-${{ github.run_number }}
          retention-days: 30
          path: |
            outputs/

      - name: Security Gate Check
        if: github.event_name == 'pull_request'
        run: |
          P1_COUNT=$(python -c "import json; d=json.load(open('outputs/noise_reduction.json')); print(d.get('p1', 0))")
          echo "P1 Findings: $P1_COUNT"
          if [ "$P1_COUNT" -gt 0 ]; then
            echo "SECURITY GATE FAILED: $P1_COUNT P1 finding(s)"
            exit 1
          fi
